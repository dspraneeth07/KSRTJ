[build]
  # Netlify sets URL at build time; pass it through so canonical links,
  # og:url and the sitemap all resolve to the real host.
  command = "VITE_SITE_URL=$URL npm run build"
  publish = "dist"

[build.environment]
  # Pinned so a Netlify default bump cannot change the build out from under us.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ── SPA routing ────────────────────────────────────────────────────
# Every route is client-rendered, so unknown paths must serve index.html
# rather than Netlify's own 404. public/_redirects says the same thing;
# this is the version that lives with the rest of the config.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ────────────────────────────────────────────────────────
# Vite fingerprints everything in /assets, so those are immutable. The
# HTML shell must never be cached or a deploy will not reach anyone
# holding an old copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Google Fonts is the only third party. 'unsafe-inline' on style-src is
    # required by Vite's injected styles and by react-three-fiber's canvas;
    # blob: on worker-src is three.js. No inline scripts are allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
