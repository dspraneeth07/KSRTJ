# Build configuration only.
#
# Redirects live in public/_redirects and headers in public/_headers, because
# those files are copied into dist/ and therefore apply however the site is
# deployed — including `netlify deploy --dir=dist` and drag-and-drop, neither
# of which ever sees this file. Keeping each rule in exactly one place also
# removes any chance of the two drifting apart.

[build]
  # Netlify sets URL at build time; passing it through to Vite is what makes
  # canonical links, og:url and the sitemap resolve to the real host, so
  # nothing needs editing when a custom domain is attached.
  command = "VITE_SITE_URL=$URL npm run build"
  publish = "dist"

[build.environment]
  # Pinned so a change to Netlify's default image cannot alter the build.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
